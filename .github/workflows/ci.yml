on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        ruby:
          - '3.4'
          - '3.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: ${{ matrix.ruby }}
      - run: bundle exec rake
